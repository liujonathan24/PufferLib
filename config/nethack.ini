[base]
env_name = nethack

[vec]
# MIG-safe, mid-search-range defaults: the sweep's first 1-2 seed experiments
# use these (no Protein suggestion yet), so they must fit 10GB and be
# representative of the swept arch range, not N=4096 outliers.
total_agents = 256
num_buffers = 1
num_threads = 2
seed = 73

[env]
# Reward shaping. Each coef is independently toggleable: set to 0 to disable
# the term. See ocean/nethack/REWARDS.md for the recipe + future candidates.
# CLI: --env.score-coef, --env.descent-coef, --env.scout-coef, --env.illegal-penalty
score_coef = 0 #0.00672
descent_coef = 3 #32.1
scout_coef = 0 #0.8865
reveal_coef = 0 # 0.09256
illegal_penalty = 0 #-1.411

[policy]
hidden_size = 192
num_layers = 2
expansion_factor = 2

[train]
gpus = 1
seed = 42
total_timesteps = 20000000
learning_rate = 0.0002968
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.9996
gae_lambda = 0.6987
replay_ratio = 5
clip_coef = 0.20
vf_coef = 0.1
vf_clip_coef = 0.01
max_grad_norm = 2.648
ent_coef = 0.05
beta1 = 0.981226
beta2 = 0.994178
eps = 1.82223e-06
minibatch_size = 256
horizon = 256
vtrace_rho_clip = 3.24229
vtrace_c_clip = 3.95664
prio_alpha = 1
prio_beta0 = 0.555562
env = 0


[sweep]
# CARBS/Protein cost-aware Bayesian search, narrowed around the 5-run random
# sweep winner (best depth 1.5). Cost dimension = train.total_timesteps,
# capped so each trial runs ~<=15 min. metric = depth (max dungeon level).
method = Protein
metric = depth
metric_distribution = linear
goal = maximize
downsample = 4
max_runs = 12
gpus = 1
max_suggestion_cost = 900
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
# No sweep_only: Protein varies every [sweep.*] dim below ("whatever Protein
# wants"). Every dim MUST be re-declared here even when pinned, because removing
# a dim falls back to default.ini's (often much wider) version.
# Arch/throughput dims are bounded to fit a 10GB MIG slice; trials that still
# OOM fail gracefully and the sweep continues.

# Cost dimension pinned at 12M so EVERY trial runs exactly 12M steps (the driver
# sets the cost to geomspace(min,max,1)[0] == min). This both fixes the budget
# for the depth@12M plot AND overrides default.ini's 3e7-1e11 range (which would
# otherwise make trials run 30M+ steps). Keeping it as a cost dim also gives
# Protein a populated cost space so the GP path works.
[sweep.train.total_timesteps]
distribution = log_normal
min = 12000000
max = 12600000
scale = auto

[sweep.env.score_coef]
distribution = log_normal
min = 0.003
mean = 0.0067
max = 0.015
scale = auto

[sweep.env.descent_coef]
distribution = uniform
min = 20.0
mean = 32.0
max = 45.0
scale = auto

[sweep.env.scout_coef]
distribution = uniform
min = 0.4
mean = 0.89
max = 1.4
scale = auto

[sweep.env.reveal_coef]
distribution = uniform
min = 0.04
mean = 0.093
max = 0.15
scale = auto

[sweep.env.illegal_penalty]
distribution = uniform
min = -2.0
mean = -1.41
max = -0.7
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00015
mean = 0.0003
max = 0.0006
scale = auto

[sweep.train.gamma]
distribution = uniform
min = 0.999
mean = 0.9996
max = 0.99985
scale = auto

[sweep.train.gae_lambda]
distribution = uniform
min = 0.55
mean = 0.70
max = 0.85
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.01
mean = 0.029
max = 0.08
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 1.5
mean = 2.65
max = 3.0
scale = auto

# ---- Arch / throughput dims, widened to real ranges bounded to fit a 10GB
# ---- MIG slice (baseline N=128/hidden=128/1-layer used ~0.5GB). All use
# ---- int_uniform so Protein yields clean integers (uniform yields floats,
# ---- which break integer-valued config like layer counts / divisibility).
[sweep.vec.total_agents]
distribution = int_uniform
min = 128
mean = 192
max = 256
scale = auto

[sweep.policy.hidden_size]
distribution = int_uniform
min = 128
mean = 192
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
mean = 2
max = 3
scale = auto

[sweep.vec.num_buffers]
distribution = int_uniform
min = 1
mean = 1
max = 2
scale = auto

# horizon pinned at integer 128: int_uniform rounds 128..128.4 -> 128, so
# minibatch_size(8192) % horizon == 0 always holds. (Plain 'uniform' yields
# floats like 128.18 -> validate_config skip -> suggest() retry storm ->
# suggestion_idx overruns num_random_samples -> GP path crashes on empty pareto.
# Must be declared here; removing it falls back to default.ini's pow2 8-1024.)
[sweep.train.horizon]
distribution = int_uniform
min = 128
mean = 128
max = 128.4
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 3.24229
mean = 3.24229
max = 3.2423
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 3.95664
mean = 3.95664
max = 3.95665
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 2.2381
mean = 2.2381
max = 2.23811
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.20
mean = 0.20
max = 0.200001
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
mean = 0.01
max = 0.010001
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
mean = 0.1
max = 0.100001
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.981226
mean = 0.981226
max = 0.981227
scale = auto

[sweep.train.beta2]
distribution = uniform
min = 0.994178
mean = 0.994178
max = 0.994179
scale = auto

[sweep.train.eps]
distribution = uniform
min = 1.82223e-06
mean = 1.82223e-06
max = 1.82224e-06
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 1.0
mean = 1.0
max = 1.000001
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.555562
mean = 0.555562
max = 0.555563
scale = auto

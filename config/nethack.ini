[base]
env_name = nethack

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 0
seed = 73

[env]
# Reward shaping. Each coef is independently toggleable: set to 0 to disable
# the term. See ocean/nethack/REWARDS.md for the recipe + future candidates.
# CLI: --env.score-coef, --env.descent-coef, --env.scout-coef, --env.illegal-penalty
score_coef = 0.01
descent_coef = 1.0
scout_coef = 0.1
illegal_penalty = -0.5

[policy]
# exp_032 Config A: small policy escapes the entropy-collapse trap that the
# 4M-param baseline kept hitting. ~13x fewer params, same agg SPS, ~40x
# faster wall-clock learning. Bigger policies still opt-in via CLI.
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 1443360107
learning_rate = 0.00224872
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99816
gae_lambda = 0.696214
replay_ratio = 2.2381
# exp_032: clip 0.01 -> 0.20, ent 0.02 -> 0.10. Old defaults collapsed
# entropy to 0 in ~60s; these hold entropy 1.2-2.4 and reach ep_return 5.1
# in 19s. See ocean/nethack/experiments/exp_032_hyperparam/RESULT.md.
clip_coef = 0.20
vf_coef = 0.1
vf_clip_coef = 0.01
max_grad_norm = 1.14364
ent_coef = 0.10
beta1 = 0.981226
beta2 = 0.994178
eps = 1.82223e-06
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 3.24229
vtrace_c_clip = 3.95664
prio_alpha = 1
prio_beta0 = 0.555562
env = 0

[sweep]
max_suggestion_cost = 7200

[sweep.env.scaffolding_ratio]
distribution = uniform
min = 0.1
mean = 0.5
max = 0.8
scale = auto

[sweep.train.learning_rate]
distribution = uniform
min = 0.0001
mean = 0.0005
max = 0.0030
scale = 0.5

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
mean = 0.5
max = 2.0
scale = 0.5
